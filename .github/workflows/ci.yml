name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR: a superseded push does not need to finish, and its result would be
# read as the result of the newer tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token is wider than a build needs. Read the repository and nothing else.
permissions:
  contents: read

jobs:
  build:
    # The toolkit only targets Windows: it drives the Source SDK compilers, srcds and a
    # real L4D2 install. A Linux runner would test a machine this project cannot run on.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The versions a contributor in 2026 actually has, and the range `engines.node`
        # promises. Node 20 is past end-of-life and is no longer tested.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose: pnpm/action-setup reads `packageManager` from
      # package.json, so the CI version and a contributor's corepack version are one number.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

      # This runner has no L4D2 install, no Source SDK and no Python sidecar, so every
      # suite that needs them skips itself and prints why. What is left is the pure logic,
      # and it has to hold on a bare Windows machine -- the machine a new contributor has.
      - run: pnpm test --reporter=json --outputFile=vitest-report.json

      # A green run with zero tests executed looks exactly like a green run that proved
      # something. If a skip guard is ever widened too far, this is what notices.
      #
      # The floor sits far below the ~1000 tests a machine with the game runs, and far
      # above zero so a collapse does. It is deliberately low enough that a bare runner
      # passing on pure logic does not trip it.
      - name: Refuse a green run that tested nothing
        shell: pwsh
        run: |
          $report = Get-Content vitest-report.json -Raw | ConvertFrom-Json
          $passed = $report.numPassedTests
          Write-Host "passed on a bare runner: $passed"
          if ($passed -lt 100) {
            Write-Host "::error::only $passed tests actually ran; a skip guard is too wide"
            exit 1
          }
