version: 2
updates:
  # pnpm is the package manager, but Dependabot reads the npm ecosystem and updates
  # pnpm-lock.yaml as well as package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A major version is a migration, not an update: TypeScript 7, Vitest 5 and zod 4 need
    # their own branch, a green CI run and a changelog entry. Patch and minor updates still
    # arrive weekly; major ones are deliberate work.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
